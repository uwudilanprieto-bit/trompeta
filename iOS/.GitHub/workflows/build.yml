name: build
on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: URL directa del IPA
        required: true
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zip unzip xz-utils
      - run: pip install lief
      - run: curl -sL "${{ inputs.ipa_url }}" -o FreeFire.ipa
      - run: |
          V=17.2.17
          curl -sL "https://github.com/frida/frida/releases/download/$V/frida-gadget-$V-ios-universal.dylib.xz" | xz -d > gadget.dylib
      - run: python3 scripts/inject.py FreeFire.ipa gadget.dylib ios/panel.js
      - uses: actions/upload-artifact@v4
        with:
          name: Trompeta
          path: Trompeta.ipa
